<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- helps it fit on phones too -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | Kieron's Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <!-- the screen size picks the css file -->
    <link rel="stylesheet" href="mobile.css" media="screen and (max-width: 600px)">
    <link rel="stylesheet" href="tablet.css" media="screen and (min-width: 601px) and (max-width: 900px)">
    <link rel="stylesheet" href="desktop.css" media="screen and (min-width: 901px)">
</head>
<body>
    <!-- name and links for the other pages -->
    <header class="site-header">
        <div class="page-width">
            <p class="site-name">Kieron's Portfolio</p>
            <nav>
                <ul class="nav-list">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Me</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- the form goes here -->
    <main class="page-width">
        <section>
            <h1>Get in touch</h1>


            <!-- required means you have to fill these in -->
            <form class="contact-form">
                <p>
                    <label for="name">Name</label>
                    <input id="name" name="name" required>
                </p>
                <p>
                    <label for="email">Email</label>
                    <!-- this checks for an email address -->
                    <input id="email" name="email" type="email" required>
                </p>
                <p>
                    <label for="phone">Cell No.</label>
                    <!-- this checks the phone number format -->
                    <input id="phone" name="phone" type="tel" pattern="[0-9+() .-]{7,20}" required>
                </p>
                <p>
                    <label for="message">Comments</label>
                    <textarea id="message" name="message" rows="6" required></textarea>
                </p>
                <p><button>Submit</button></p>
            </form>
        </section>
    </main>

    <!-- my email and copyright at the bottom -->
    <footer class="site-footer">
        <div class="page-width">
            <p>Email me: kieron.edwards@ontariotechu.net</p>
            <p>© 2026 Kieron Edwards</p>
        </div>
    </footer>
</body>
</html>
